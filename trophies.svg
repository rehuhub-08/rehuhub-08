<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="card-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#160c38" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#05030f" stop-opacity="1" />
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="card-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#25164f" stroke-width="1" stroke-opacity="0.3" />
    </pattern>

    <!-- Border Gradient -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Holographic sweep gradient -->
    <linearGradient id="holo-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0" />
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#8a2be2" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: "SF Mono", Consolas, "Fira Code", Monaco, monospace; }
    .sans { font-family: "Segoe UI", Roboto, -apple-system, sans-serif; }

    /* Pop-in animation */
    .cell {
      transform-origin: center;
      animation: pop-in 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      opacity: 0;
    }
    @keyframes pop-in {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Holographic Shine Sweep */
    .holo-shine {
      animation: shine 6s linear infinite;
    }
    @keyframes shine {
      0% { transform: translate(-450px, -220px); }
      35%, 100% { transform: translate(450px, 220px); }
    }

    /* Subtle icon pulsing */
    .icon {
      transition: transform 0.3s ease;
    }
    .cell-group:hover .icon {
      transform: scale(1.1);
    }
  </style>

  <!-- Background and grid -->
  <rect width="900" height="220" rx="12" fill="url(#card-glow)" stroke="url(#card-border)" stroke-width="1.5" stroke-opacity="0.6" />
  <rect width="900" height="220" rx="12" fill="url(#card-grid)" />

  <!-- Headline -->
  <text x="35" y="32" class="mono" font-size="12" fill="#8b7cb8" font-weight="bold" letter-spacing="2">ACHIEVEMENTS / REWARDS SYSTEM</text>

  <!-- Cell 1: Master Builder -->
  <g class="cell-group" transform="translate(30, 50)">
    <rect class="cell" width="190" height="140" rx="8" fill="#090518" stroke="#ff007f" stroke-width="1.2" stroke-opacity="0.5" />
    
    <!-- Rank Tag -->
    <rect x="135" y="10" width="45" height="18" rx="4" fill="#ff007f" fill-opacity="0.2" stroke="#ff007f" stroke-width="1" />
    <text x="157" y="22" class="mono" font-size="9" fill="#ff007f" font-weight="bold" text-anchor="middle">RANK S</text>

    <!-- Trophy Icon (Vector path) -->
    <g transform="translate(20, 20)">
      <path class="icon" d="M 12 5 L 28 5 L 28 17 Q 28 27 20 27 Q 12 27 12 17 Z M 7 9 Q 12 9 12 14 M 33 9 Q 28 9 28 14 M 20 27 L 20 33 M 14 33 L 26 33" stroke="#ff007f" stroke-width="1.5" fill="none" />
    </g>

    <!-- Text -->
    <text x="20" y="90" class="mono" font-size="13" fill="#ffffff" font-weight="bold">Master Builder</text>
    <text x="20" y="110" class="sans" font-size="11" fill="#a49bc2">Full-Stack Dev</text>
  </g>

  <!-- Cell 2: Automation Wizard -->
  <g class="cell-group" transform="translate(243, 50)">
    <rect class="cell" width="190" height="140" rx="8" fill="#090518" stroke="#8a2be2" stroke-width="1.2" stroke-opacity="0.5" style="animation-delay: 0.15s;" />
    
    <!-- Rank Tag -->
    <rect x="135" y="10" width="45" height="18" rx="4" fill="#8a2be2" fill-opacity="0.2" stroke="#8a2be2" stroke-width="1" />
    <text x="157" y="22" class="mono" font-size="9" fill="#8a2be2" font-weight="bold" text-anchor="middle">LEVEL A</text>

    <!-- Magic Wand Icon -->
    <g transform="translate(20, 20)">
      <path class="icon" d="M 6 30 L 26 10 M 24 6 Q 26 8 28 10 M 15 15 L 17 13 M 28 4 L 28 8" stroke="#8a2be2" stroke-width="1.5" fill="none" />
      <circle cx="10" cy="12" r="1.5" fill="#8a2be2" />
      <circle cx="28" cy="18" r="1.5" fill="#8a2be2" />
    </g>

    <!-- Text -->
    <text x="20" y="90" class="mono" font-size="13" fill="#ffffff" font-weight="bold">Automation Wizard</text>
    <text x="20" y="110" class="sans" font-size="11" fill="#a49bc2">AI &amp; Script Systems</text>
  </g>

  <!-- Cell 3: UI Crafter -->
  <g class="cell-group" transform="translate(456, 50)">
    <rect class="cell" width="190" height="140" rx="8" fill="#090518" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.5" style="animation-delay: 0.3s;" />
    
    <!-- Rank Tag -->
    <rect x="135" y="10" width="45" height="18" rx="4" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="1" />
    <text x="157" y="22" class="mono" font-size="9" fill="#00f0ff" font-weight="bold" text-anchor="middle">LEVEL 99</text>

    <!-- Layout/Wireframe Icon -->
    <g transform="translate(20, 20)">
      <rect class="icon" x="4" y="4" width="32" height="26" rx="3" stroke="#00f0ff" stroke-width="1.5" fill="none" />
      <line x1="4" y1="12" x2="36" y2="12" stroke="#00f0ff" stroke-width="1.5" />
      <line x1="14" y1="12" x2="14" y2="30" stroke="#00f0ff" stroke-width="1.5" />
    </g>

    <!-- Text -->
    <text x="20" y="90" class="mono" font-size="13" fill="#ffffff" font-weight="bold">UI Crafter</text>
    <text x="20" y="110" class="sans" font-size="11" fill="#a49bc2">React &amp; CSS Layouts</text>
  </g>

  <!-- Cell 4: Open Source Contributor -->
  <g class="cell-group" transform="translate(670, 50)">
    <rect class="cell" width="190" height="140" rx="8" fill="#090518" stroke="#ff007f" stroke-width="1.2" stroke-opacity="0.5" style="animation-delay: 0.45s;" />
    
    <!-- Rank Tag -->
    <rect x="135" y="10" width="45" height="18" rx="4" fill="#ff007f" fill-opacity="0.2" stroke="#ff007f" stroke-width="1" />
    <text x="157" y="22" class="mono" font-size="9" fill="#ff007f" font-weight="bold" text-anchor="middle">RANK S</text>

    <!-- Git Branch / Merge Icon -->
    <g transform="translate(20, 20)">
      <circle class="icon" cx="12" cy="8" r="4" fill="none" stroke="#ff007f" stroke-width="1.5" />
      <circle cx="12" cy="28" r="4" fill="none" stroke="#ff007f" stroke-width="1.5" />
      <circle cx="28" cy="18" r="4" fill="none" stroke="#ff007f" stroke-width="1.5" />
      <line x1="12" y1="12" x2="12" y2="24" stroke="#ff007f" stroke-width="1.5" />
      <path d="M 12 24 Q 28 24 28 22" fill="none" stroke="#ff007f" stroke-width="1.5" />
    </g>

    <!-- Text -->
    <text x="20" y="90" class="mono" font-size="13" fill="#ffffff" font-weight="bold">Git Commander</text>
    <text x="20" y="110" class="sans" font-size="11" fill="#a49bc2">Git &amp; GitHub Expert</text>
  </g>

  <!-- Holographic Sweep Overlay -->
  <rect x="0" y="0" width="900" height="220" fill="url(#holo-sweep)" class="holo-shine" pointer-events="none" />
</svg>
