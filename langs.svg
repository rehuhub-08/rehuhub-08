<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="450" height="300" fill="none">
  <defs>
    <!-- Background glow -->
    <radialGradient id="card-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#160c38" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#05030f" stop-opacity="1" />
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="card-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#25164f" stroke-width="1" stroke-opacity="0.3" />
    </pattern>

    <!-- Gradient for borders -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Gradients for individual language bars -->
    <linearGradient id="js-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#f7df1e" />
    </linearGradient>
    <linearGradient id="react-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#61dafb" />
    </linearGradient>
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#339933" />
    </linearGradient>
    <linearGradient id="supabase-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#3ecf8e" />
    </linearGradient>
    <linearGradient id="html-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#e34f26" />
    </linearGradient>
    <linearGradient id="css-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#1572b6" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: "SF Mono", Consolas, "Fira Code", Monaco, monospace; }
    .sans { font-family: "Segoe UI", Roboto, -apple-system, sans-serif; }

    /* Progress bar animation */
    .bar {
      transform-origin: left;
      animation: grow 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes grow {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    /* Icon simple scaling on card hover */
    .lang-label {
      transition: fill 0.3s ease;
    }
    svg:hover .lang-label {
      fill: #ffffff;
    }
  </style>

  <!-- Card background & grid -->
  <rect width="450" height="300" rx="12" fill="url(#card-glow)" stroke="url(#card-border)" stroke-width="1.5" stroke-opacity="0.6" />
  <rect width="450" height="300" rx="12" fill="url(#card-grid)" />

  <!-- Header -->
  <g transform="translate(30, 45)">
    <text x="0" y="0" class="mono" font-size="20" font-weight="bold" fill="#ffffff">rehan@github:~$ <tspan fill="#ff007f">langs --list</tspan></text>
    <line x1="0" y1="12" x2="390" y2="12" stroke="#8a2be2" stroke-width="1" stroke-opacity="0.3" />
  </g>

  <!-- LANGUAGES LIST -->
  <!-- ================================================== -->
  <!-- EDIT VALUES HERE (Percentage and bar width)        -->
  <!-- ================================================== -->

  <!-- Lang 1: JavaScript -->
  <g transform="translate(30, 85)">
    <!-- Label -->
    <text x="0" y="13" class="mono lang-label" font-size="14" fill="#a49bc2">JavaScript</text>
    <!-- Value -->
    <text x="390" y="13" class="mono" font-size="14" fill="#f7df1e" font-weight="bold" text-anchor="end">35%</text>
    <!-- Bar Container -->
    <rect x="0" y="22" width="390" height="5" rx="2.5" fill="#1b123a" />
    <!-- Bar -->
    <rect class="bar" x="0" y="22" width="136" height="5" rx="2.5" fill="url(#js-grad)" />
  </g>

  <!-- Lang 2: React -->
  <g transform="translate(30, 120)">
    <!-- Label -->
    <text x="0" y="13" class="mono lang-label" font-size="14" fill="#a49bc2">React</text>
    <!-- Value -->
    <text x="390" y="13" class="mono" font-size="14" fill="#61dafb" font-weight="bold" text-anchor="end">25%</text>
    <!-- Bar Container -->
    <rect x="0" y="22" width="390" height="5" rx="2.5" fill="#1b123a" />
    <!-- Bar -->
    <rect class="bar" x="0" y="22" width="97.5" height="5" rx="2.5" fill="url(#react-grad)" style="animation-delay: 0.15s;" />
  </g>

  <!-- Lang 3: Node.js -->
  <g transform="translate(30, 155)">
    <!-- Label -->
    <text x="0" y="13" class="mono lang-label" font-size="14" fill="#a49bc2">Node.js</text>
    <!-- Value -->
    <text x="390" y="13" class="mono" font-size="14" fill="#339933" font-weight="bold" text-anchor="end">15%</text>
    <!-- Bar Container -->
    <rect x="0" y="22" width="390" height="5" rx="2.5" fill="#1b123a" />
    <!-- Bar -->
    <rect class="bar" x="0" y="22" width="58.5" height="5" rx="2.5" fill="url(#node-grad)" style="animation-delay: 0.3s;" />
  </g>

  <!-- Lang 4: Supabase -->
  <g transform="translate(30, 190)">
    <!-- Label -->
    <text x="0" y="13" class="mono lang-label" font-size="14" fill="#a49bc2">Supabase</text>
    <!-- Value -->
    <text x="390" y="13" class="mono" font-size="14" fill="#3ecf8e" font-weight="bold" text-anchor="end">10%</text>
    <!-- Bar Container -->
    <rect x="0" y="22" width="390" height="5" rx="2.5" fill="#1b123a" />
    <!-- Bar -->
    <rect class="bar" x="0" y="22" width="39" height="5" rx="2.5" fill="url(#supabase-grad)" style="animation-delay: 0.45s;" />
  </g>

  <!-- Lang 5: HTML -->
  <g transform="translate(30, 225)">
    <!-- Label -->
    <text x="0" y="13" class="mono lang-label" font-size="14" fill="#a49bc2">HTML</text>
    <!-- Value -->
    <text x="390" y="13" class="mono" font-size="14" fill="#e34f26" font-weight="bold" text-anchor="end">10%</text>
    <!-- Bar Container -->
    <rect x="0" y="22" width="390" height="5" rx="2.5" fill="#1b123a" />
    <!-- Bar -->
    <rect class="bar" x="0" y="22" width="39" height="5" rx="2.5" fill="url(#html-grad)" style="animation-delay: 0.6s;" />
  </g>

  <!-- Lang 6: CSS -->
  <g transform="translate(30, 260)">
    <!-- Label -->
    <text x="0" y="13" class="mono lang-label" font-size="14" fill="#a49bc2">CSS</text>
    <!-- Value -->
    <text x="390" y="13" class="mono" font-size="14" fill="#1572b6" font-weight="bold" text-anchor="end">5%</text>
    <!-- Bar Container -->
    <rect x="0" y="22" width="390" height="5" rx="2.5" fill="#1b123a" />
    <!-- Bar -->
    <rect class="bar" x="0" y="22" width="19.5" height="5" rx="2.5" fill="url(#css-grad)" style="animation-delay: 0.75s;" />
  </g>

</svg>
