<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="450" height="300" fill="none">
  <defs>
    <!-- Background glow -->
    <radialGradient id="card-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#160c38" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#05030f" stop-opacity="1" />
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="card-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#25164f" stroke-width="1" stroke-opacity="0.3" />
    </pattern>

    <!-- Gradient for borders -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Bar gradients -->
    <linearGradient id="repos-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="contribs-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: "SF Mono", Consolas, "Fira Code", Monaco, monospace; }
    .sans { font-family: "Segoe UI", Roboto, -apple-system, sans-serif; }
    
    /* Hover and pulse effects */
    .glow-header {
      animation: neon-pulse 2s ease-in-out infinite alternate;
    }
    @keyframes neon-pulse {
      0% { fill: #00f0ff; filter: drop-shadow(0 0 2px #00f0ff); }
      100% { fill: #ff007f; filter: drop-shadow(0 0 2px #ff007f); }
    }

    /* Progress bar grow animation */
    .bar {
      transform-origin: left;
      animation: grow 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes grow {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    /* Icon hover animations */
    .icon {
      transition: transform 0.3s ease;
    }
    svg:hover .icon {
      transform: scale(1.1);
    }
  </style>

  <!-- Card background & grid -->
  <rect width="450" height="300" rx="12" fill="url(#card-glow)" stroke="url(#card-border)" stroke-width="1.5" stroke-opacity="0.6" />
  <rect width="450" height="300" rx="12" fill="url(#card-grid)" />

  <!-- Header -->
  <g transform="translate(30, 45)">
    <!-- Terminal-like title -->
    <text x="0" y="0" class="mono" font-size="20" font-weight="bold" fill="#ffffff">rehan@github:~$ <tspan fill="#00f0ff">neofetch</tspan></text>
    <line x1="0" y1="12" x2="390" y2="12" stroke="#8a2be2" stroke-width="1" stroke-opacity="0.3" />
  </g>

  <!-- STATS LIST -->
  <!-- ================================================== -->
  <!-- EDIT STATS VALUES HERE (Change text and bar width) -->
  <!-- ================================================== -->

  <!-- Stat 1: Repositories -->
  <g transform="translate(30, 95)">
    <!-- Icon -->
    <path class="icon" d="M 0 0 L 16 0 L 16 16 L 0 16 Z" fill="none" stroke="#00f0ff" stroke-width="1.5" />
    <path d="M 4 4 L 12 4 M 4 8 L 12 8 M 4 12 L 8 12" stroke="#00f0ff" stroke-width="1.5" />
    <!-- Label -->
    <text x="28" y="13" class="mono" font-size="14" fill="#a49bc2">Repositories</text>
    <!-- Value -->
    <text x="390" y="13" class="mono" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="end">18</text>
    <!-- Progress Bar container -->
    <rect x="0" y="24" width="390" height="6" rx="3" fill="#1b123a" />
    <!-- Progress Bar (Edit scaleX or use width to match value) -->
    <rect class="bar" x="0" y="24" width="220" height="6" rx="3" fill="url(#repos-grad)" />
  </g>

  <!-- Stat 2: Contributions -->
  <g transform="translate(30, 145)">
    <!-- Icon -->
    <path class="icon" d="M 0 4 Q 8 -2 16 4 L 16 14 Q 8 8 0 14 Z" fill="none" stroke="#ff007f" stroke-width="1.5" />
    <!-- Label -->
    <text x="28" y="13" class="mono" font-size="14" fill="#a49bc2">Contributions</text>
    <!-- Value -->
    <text x="390" y="13" class="mono" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="end">412</text>
    <!-- Progress Bar container -->
    <rect x="0" y="24" width="390" height="6" rx="3" fill="#1b123a" />
    <!-- Progress Bar -->
    <rect class="bar" x="0" y="24" width="310" height="6" rx="3" fill="url(#contribs-grad)" style="animation-delay: 0.2s;" />
  </g>

  <!-- Stat 3: Followers -->
  <g transform="translate(30, 195)">
    <!-- Icon -->
    <circle class="icon" cx="8" cy="6" r="4" fill="none" stroke="#00f0ff" stroke-width="1.5" />
    <path d="M 1 15 A 7 7 0 0 1 15 15" stroke="#00f0ff" stroke-width="1.5" />
    <!-- Label -->
    <text x="28" y="13" class="mono" font-size="14" fill="#a49bc2">Followers</text>
    <!-- Value -->
    <text x="390" y="13" class="mono" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="end">12</text>
    <!-- Progress Bar container -->
    <rect x="0" y="24" width="390" height="6" rx="3" fill="#1b123a" />
    <!-- Progress Bar -->
    <rect class="bar" x="0" y="24" width="160" height="6" rx="3" fill="url(#repos-grad)" style="animation-delay: 0.4s;" />
  </g>

  <!-- Stat 4: Following -->
  <g transform="translate(30, 245)">
    <!-- Icon -->
    <circle class="icon" cx="6" cy="6" r="3.5" fill="none" stroke="#ff007f" stroke-width="1.5" />
    <path d="M 0 14 A 5 5 0 0 1 12 14" stroke="#ff007f" stroke-width="1.5" />
    <line x1="12" y1="10" x2="16" y2="14" stroke="#ff007f" stroke-width="1.5" />
    <!-- Label -->
    <text x="28" y="13" class="mono" font-size="14" fill="#a49bc2">Following</text>
    <!-- Value -->
    <text x="390" y="13" class="mono" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="end">15</text>
    <!-- Progress Bar container -->
    <rect x="0" y="24" width="390" height="6" rx="3" fill="#1b123a" />
    <!-- Progress Bar -->
    <rect class="bar" x="0" y="24" width="190" height="6" rx="3" fill="url(#contribs-grad)" style="animation-delay: 0.6s;" />
  </g>

</svg>
